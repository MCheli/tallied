name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly rebuild on a freshly pulled base so OS security fixes land without a code change.
  # Friday 08:00 UTC, so Saturday's security sweep sees the result. Same test + migrate gates as a push.
  schedule:
    - cron: "0 8 * * 5"
  workflow_dispatch:

# Least privilege for every job; build-and-push widens to packages: write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mcheli/tallied

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Lint backend
        run: |
          cd backend
          ruff check app ../scripts

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v

      - name: Check requirements ledger
        run: python scripts/ledger_check.py

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: TypeScript check
        run: |
          cd frontend
          npx vue-tsc -b
      - name: Production bundle smoke test (serves the real build in Chrome)
        working-directory: frontend
        run: |
          npm run build
          node ../scripts/build_smoke.mjs

      - name: Frontend unit tests
        run: |
          cd frontend
          npx vitest run

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

  migrate:
    name: Migrate an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.16-alpine3.24
        env:
          POSTGRES_USER: tallied
          POSTGRES_PASSWORD: tallied_dev
          POSTGRES_DB: tallied
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tallied"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FINANCE_DATABASE_URL: postgresql://tallied:tallied_dev@localhost:5432/tallied
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: alembic upgrade head on an empty database
        run: |
          cd backend
          alembic upgrade head
          alembic current

      - name: Create a tenant schema and check the platform tables exist
        run: |
          cd backend
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.config import settings
          from app.services.tenant_service import PLATFORM_TABLES, create_tenant_schema
          create_tenant_schema("tenant_ci000001")
          e = create_engine(settings.database_url)
          with e.connect() as c:
              public = {r[0] for r in c.execute(text("select table_name from information_schema.tables where table_schema='public'"))}
              tenant = c.execute(text("select count(*) from information_schema.tables where table_schema='tenant_ci000001'")).scalar()
          missing = PLATFORM_TABLES - public
          assert not missing, f"platform tables missing after migration: {missing}"
          assert tenant >= 20, f"tenant schema has only {tenant} tables"
          print("platform tables:", sorted(public))
          print("tenant tables:", tenant)
          PY

      - name: e2e tests against the migrated database
        run: |
          cd backend
          pytest tests/test_e2e -m e2e -q -x --deselect tests/test_e2e/test_import_documents.py
        env:
          E2E_DATABASE_URL: postgresql://tallied:tallied_dev@localhost:5432/tallied

  build-and-push:
    name: Build & Push Docker Image
    needs: [test, migrate]
    runs-on: ubuntu-latest
    # PRs build the image without logging in or pushing; everything else publishes only from main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: ${{ github.event_name == 'pull_request' }}

      - name: Smoke test the image (migrate, healthy, no curl)
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_USER=tallied -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=tallied postgres:16.16-alpine3.24
          # The app runs migrations once at boot and exits if the DB refuses, so wait for Postgres first.
          for _ in $(seq 1 30); do
            docker exec db pg_isready -h 127.0.0.1 -U tallied -d tallied >/dev/null 2>&1 && break; sleep 1
          done
          docker exec db pg_isready -h 127.0.0.1 -U tallied -d tallied
          # Production config fails closed on default secrets, so give the smoke run throwaway ones.
          docker run -d --name app --network smoke \
            -e FINANCE_DATABASE_URL=postgresql://tallied:smoke@db:5432/tallied \
            -e FINANCE_SECRET_KEY="$(openssl rand -base64 48)" \
            -e FINANCE_API_KEY_PEPPER="$(openssl rand -base64 32)" \
            -e FINANCE_CREDENTIAL_KEY="$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            -e APP_ROLE=web \
            "$IMAGE"
          for _ in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' app); [ "$s" = healthy ] && break; sleep 2
          done
          docker logs app
          [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ]
          docker run --rm --entrypoint sh "$IMAGE" -c '! command -v curl'
          docker image inspect -f 'image size: {{.Size}} bytes' "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c 'echo "dpkg packages: $(dpkg-query -W | wc -l)"'
