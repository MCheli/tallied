name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly rebuild on a freshly pulled base so OS security fixes land without a code change.
  # Friday 08:00 UTC, so Saturday's security sweep sees the result. Same test + migrate gates as a push.
  schedule:
    - cron: "0 8 * * 5"
  workflow_dispatch:

# Least privilege for every job; build-and-push widens to packages: write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mcheli/tallied

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Lint backend
        run: |
          cd backend
          ruff check app ../scripts

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v

      - name: Check requirements ledger
        run: python scripts/ledger_check.py

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: TypeScript check
        run: |
          cd frontend
          npx vue-tsc -b
      - name: Production bundle smoke test (serves the real build in Chrome)
        working-directory: frontend
        run: |
          npm run build
          node ../scripts/build_smoke.mjs

      - name: Frontend unit tests
        run: |
          cd frontend
          npx vitest run

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

  migrate:
    name: Migrate an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: tallied
          POSTGRES_PASSWORD: tallied_dev
          POSTGRES_DB: tallied
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tallied"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FINANCE_DATABASE_URL: postgresql://tallied:tallied_dev@localhost:5432/tallied
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: alembic upgrade head on an empty database
        run: |
          cd backend
          alembic upgrade head
          alembic current

      - name: Create a tenant schema and check the platform tables exist
        run: |
          cd backend
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.config import settings
          from app.services.tenant_service import PLATFORM_TABLES, create_tenant_schema
          create_tenant_schema("tenant_ci000001")
          e = create_engine(settings.database_url)
          with e.connect() as c:
              public = {r[0] for r in c.execute(text("select table_name from information_schema.tables where table_schema='public'"))}
              tenant = c.execute(text("select count(*) from information_schema.tables where table_schema='tenant_ci000001'")).scalar()
          missing = PLATFORM_TABLES - public
          assert not missing, f"platform tables missing after migration: {missing}"
          assert tenant >= 20, f"tenant schema has only {tenant} tables"
          print("platform tables:", sorted(public))
          print("tenant tables:", tenant)
          PY

      - name: e2e tests against the migrated database
        run: |
          cd backend
          pytest tests/test_e2e -m e2e -q -x --deselect tests/test_e2e/test_import_documents.py
        env:
          E2E_DATABASE_URL: postgresql://tallied:tallied_dev@localhost:5432/tallied

  build-and-push:
    name: Build & Push Docker Image
    needs: [test, migrate]
    runs-on: ubuntu-latest
    # PRs build the image without logging in or pushing; everything else publishes only from main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
