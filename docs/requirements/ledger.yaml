  - id: FEED-001
    title: SimpleFIN is the bank connection
    job: feed
    area: connections
    priority: p0
    visible: true
    done_means:
      - "Settings shows one SimpleFIN tab: connect with a setup token, choose per account whether balances and transactions sync, sync now, refresh credentials, disconnect."
      - "Each sync is a sync_jobs row that ends succeeded or failed with counts; the scheduler runs one every 12 hours for every tenant with a link."
      - "account_type and display_group are chosen at connect time from the SimpleFIN account kind and stored; they are not re-guessed from the name on each sync."
      - "The access URL is encrypted at rest and never returned by any endpoint."
      - "The Cash page's Sync button triggers a SimpleFIN sync or is absent."
    status: done
    evidence:
      - backend/tests/test_sync_scheduler.py::test_generic_sync_upserts_accounts_balances_and_transactions
      - backend/tests/test_sync_scheduler.py::test_normalize_simplefin_payload
      - backend/tests/test_sync_scheduler.py::test_credential_round_trip_and_passthrough
      - artifacts/screens/settings/desktop.png
      - artifacts/screens/settings/mobile.png
    notes:
      - "2026-10-29: BUG-6 and SEC-3 cover the type guessing and plaintext credential. Monarch and Plaid removed (DEC-1, DEC-2)."
      - "2026-10-29: provider interface + generic scheduler landed; type at connect; encrypted credential; Cash Sync button uses SimpleFIN. Settings tab rework pending."
      - "2026-10-29: SimpleFinTab rebuilt with per-account type select; all done_means met."
  - id: FEED-002
    title: Document import proposes, the owner confirms
    job: feed
    area: import
    priority: p0
    visible: true
    done_means:
      - "From Income, RSU, 401(k) and Property, the import modal accepts PDF, XLSX and CSV, shows the AI's proposed changes per field with current and new values, and writes nothing until Accept Selected Changes."
      - "Extraction uses structured outputs through the shared AI client; each context has a Pydantic schema and a fixture document in fixtures/test_documents with its expected values in MANIFEST.md."
      - "Without an API key the modal says the feature needs FINANCE_ANTHROPIC_API_KEY instead of showing raw JSON."
      - "Confirm applies only accepted changes; an empty acceptance applies nothing."
      - "A unit test feeds a recorded extraction for each context through review and confirm and checks the rows written."
    status: in_progress
    evidence:
      - backend/tests/test_ai.py::test_import_upload_uses_schema_and_builds_w2_changes
      - backend/tests/test_ai.py::test_import_upload_without_key_is_503
      - backend/tests/test_ai.py::test_chat_action_comes_from_the_tool_and_is_whitelisted
    notes:
      - "2026-10-29: structured outputs per context, 503 with a clear message without a key, review chat corrections via a strict tool with column whitelist. Recorded-extraction tests exist for income only; retirement, property, rsu and the modal error display pending."
  - id: FEED-003
    title: Email receipts become transactions, attributed safely
    job: feed
    area: email
    priority: p1
    done_means:
      - "A receipt forwarded from a registered address creates one transaction with merchant, amount, date and category, and a receipt row with status parsed; a failed parse is a receipt row with status failed and the error."
      - "The tenant is resolved from the SMTP envelope sender against the owner's registered addresses, never from a From: line inside the body; the webhook secret is compared in constant time."
      - "Registering an address another tenant already registered fails without revealing that fact."
    status: in_progress
    notes:
      - "2026-10-29: DEC-4 'fix auth only'; SEC-2 and SEC-7."
      - "2026-10-29: attribution now from the envelope sender only; secret compared in constant time. Parse and duplicate-message behaviour pending."
  - id: FEED-004
    title: Manual entry covers every field a page shows
    job: feed
    area: settings
    priority: p1
    visible: true
    done_means:
      - "Settings → Income exposes every W-2 field the Income page uses (14 numeric fields), and a year entered there shows the same tiles as an imported year."
      - "Settings → Accounts can set name, institution, type, group, active, include in net worth and notes."
      - "Settings → Import History lists the import_logs rows written by confirm."
    status: done
    evidence:
