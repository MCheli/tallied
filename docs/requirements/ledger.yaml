  - id: PLAN-V2-001
    title: Planning answers "will it work" with a chance of success and a wealth fan, not only a table
    job: plan
    area: planning
    priority: p0
    visible: true
    done_means:
      - "The outlook runs 1,000 Monte Carlo paths with a fixed seed (same answer twice), returns lognormal around the plan's return assumptions with the 1928–2025 volatility of the phase's stock/bond mix; the headline shows the chance of success against the plan's target with an on-track/close/off-track label (icon + text)."
      - "The wealth chart draws 10–90% and 25–75% bands and the median by age in today's dollars, with the median net worth overlaid, the retirement age and the access milestones (55, 59½, 62, 65, full retirement age, 70) marked, and an empty state."
      - "The plan line (every return at its median) sits within 15% of the Monte Carlo median at retirement and is what plan_projections stores."
      - "The page lists the real figures the plan starts from (investable, 401(k) and Roth basis, company stock, pay and its source, scheduled vests, home) with their dates."
    status: done
    evidence:
      - backend/tests/test_engine/test_retirement_sim.py::test_monte_carlo_is_reproducible_and_moves_the_right_way
      - backend/tests/test_engine/test_retirement_sim.py::test_plan_line_sits_near_the_monte_carlo_median
      - backend/tests/test_api/test_planning_v2.py::test_outlook_starts_from_the_household_and_income_does_not_stop_after_the_last_vest
      - frontend/tests/planning-outlook.spec.ts#turns percentile bands into stacked base + width series
      - frontend/tests/planning-outlook.spec.ts#grades the chance of success against the target
      - frontend/tests/planning-years.spec.ts#puts milestones on the age axis (59½ on 60) and drops those outside it
      - artifacts/screens/planning/desktop.png
      - artifacts/screens/planning/mobile.png
    notes:
      - "2026-10-29: built on branch worktree-agent-ab96287648ec64335 (engine/retirement_sim.py, services/retirement_outlook.py, PlanningView.vue)."
  - id: PLAN-V2-002
    title: Age comes from a birth date; income does not stop after the last scheduled vest
    job: plan
    area: planning
    priority: p0
