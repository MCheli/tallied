  - id: FEED-003
    title: Email receipts become transactions, attributed safely
    job: feed
    area: email
    priority: p1
    done_means:
      - "A receipt forwarded from a registered address creates one transaction with merchant, amount, date and category, and a receipt row with status parsed; a failed parse is a receipt row with status failed and the error."
      - "The tenant is resolved from the SMTP envelope sender against the owner's registered addresses, never from a From: line inside the body; the webhook secret is compared in constant time."
      - "Registering an address another tenant already registered fails without revealing that fact."
    status: done
    evidence:
      - backend/tests/test_api/test_statements_and_forecast.py::test_inbound_receipt_is_queued_then_processed
      - backend/tests/test_ai.py::test_receipt_parse_returns_error_for_non_receipts
      - backend/tests/test_ai.py::test_receipt_to_transaction
    notes:
      - "2026-10-29: DEC-4 'fix auth only'; SEC-2 and SEC-7."
      - "2026-10-29: attribution now from the envelope sender only; secret compared in constant time. Parse and duplicate-message behaviour pending."
      - "2026-10-29: the webhook stores the receipt and returns 202; parsing and the transaction write run in a background task; failures land as status=failed with the error."
