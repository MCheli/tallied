      - artifacts/screens/settings/desktop.png
    notes:
      - "2026-10-29: the form has 8 of 14 W-2 fields; Import History calls a route that 404s (BUG-8)."
      - "2026-10-29: IncomeTab has all 14 W-2 fields; AccountsTab can set is_active; Import History reads GET /import/logs."
  - id: FEED-005
    title: The seed is the fixture and it is current
    job: feed
    area: seed
    priority: p0
    done_means:
      - "`make seed-test` rebuilds the Claudius tenant with transactions and snapshots whose latest month is the month it runs, so every page's default period has data."
      - "The seed contains no real person's address, employer plan name or figures; the persona matches CLAUDE.md and fixtures/test_documents/MANIFEST.md (456 Oak Street, Springfield MA)."
      - "The seed's stock price row survives page loads in tests (the price cache does not delete non-yahoo rows for today when a yahoo row cannot be fetched)."
    status: done
    evidence:
