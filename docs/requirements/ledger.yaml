      - backend/tests/test_data_rules.py::test_price_cache_keeps_seed_rows
    notes:
      - "2026-10-29: data ends 2026-02/03; seed address was a real-looking Ashland MA address; Yahoo overwrote the seed price (investments brief 1.5)."
      - "2026-10-29: snapshots and transactions end in the current month; persona address only; a seeded price row is used for its day instead of being replaced."
