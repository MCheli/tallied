# Tallied requirements ledger.
# Source of truth for scope: docs/PRODUCT.md. Schema and rules: docs/ARCHITECTURE.md "Requirements ledger".
# Gate: `make ledger-check` (scripts/ledger_check.py), also run by CI and `make pre-commit`.
#
# Every entry starts as todo with no evidence. It becomes done only with evidence:
#   - a test that exercises the real code path:  backend/tests/<file>.py::<test_fn>  or  frontend/tests/<file>.spec.ts#<title>
#   - for anything visible (visible: true):      artifacts/screens/<route>/<viewport>.png from `make tour`
#
# Conventions in done_means:
#   "the seed"   = `make seed-test`, the Claudius Banks fixture (scripts/seed_test_data.py). Its dates are relative
#                  to the day it runs, so "last 3 months" style defaults always have data.
#   "the tour"   = scripts/screenshot_tour.mjs at 390px (mobile) and 1440px (desktop).
#   Figures quoted are the seed's unless stated.
#
# Created 2026-10-29 from docs/REVIEW-2026-10-29.md and the as-built briefs in docs/research/as-built-2026-10/.

requirements:

  # ---------------------------------------------------------------------------
  # LOOK — Dashboard
  # ---------------------------------------------------------------------------

  - id: LOOK-001
    title: Net worth and liquid net worth from the latest balance per account
    job: look
    area: dashboard
    priority: p0
    visible: true
    done_means:
      - "With the seed, the Net Worth tile equals the sum of the latest balance_snapshots row per active account with include_in_nw, and the Liquid Net Worth tile equals the cash plus investments plus company-stock layers; the InfoTooltip states exactly those definitions."
      - "The Liquidity Layers waterfall's final bar equals the Net Worth tile even when an account has include_in_nw=false (unit test with one excluded account)."
      - "Each balance-bearing tile shows the as-of date of the newest snapshot it used."
    status: in_progress
    evidence:
      - backend/tests/test_data_rules.py::test_snapshot_dedupes_same_day_rows_and_reports_as_of
    notes:
      - "2026-10-29: today the tooltip claims credit cards are included in liquid net worth and the waterfall ignores include_in_nw (money brief 1.5)."
      - "2026-10-29: /snapshot returns as_of per layer/account, honours include_in_nw in layer totals, dedupes same-day rows, and the 12-month change uses each account's newest snapshot on or before a year ago. Dashboard tooltip/waterfall wiring pending."
  - id: LOOK-002
    title: Recent spending tile obeys its window
    job: look
    area: dashboard
    priority: p0
    visible: true
    done_means:
      - "The Last 30 Days Spending tile sums only transactions dated within the last 30 days, using the API client's typed call; with the seed it shows the last month's categories, not the all-time totals."
      - "When there are no transactions in the window the tile shows an empty state saying so."
    status: todo
    notes:
      - "2026-10-29: BUG-2 — the view sends start_date/end_date, the endpoint reads from_date/to_date, so the tile is all-time."

  - id: LOOK-003
    title: One home-equity number
    job: look
    area: dashboard
    priority: p1
    visible: true
    done_means:
      - "The Property Equity tile and the Home Equity layer show the same figure, because the Property page writes a balance snapshot for the real-estate account whenever the valuation changes (PRODUCT.md decision D2)."
    status: done
    evidence:
      - backend/tests/test_data_rules.py::test_property_valuation_writes_the_balance_snapshot
      - artifacts/screens/dashboard/desktop.png
    notes:
      - "2026-10-29: valuations (manual and Realtor) and imported mortgage/401(k) statements write balance snapshots (services/balances.record_balance); the seed mortgage snapshot now ends at the statement balance."
  - id: LOOK-004
    title: Net worth over time by layer
    job: look
    area: dashboard
    priority: p1
    visible: true
    done_means:
      - "The trend chart groups accounts by the same normalised display_group names as the snapshot layers, so an account in layer Cash is in the Cash series."
      - "Liabilities render as a separate negative series, not stacked into the positive area."
      - "On a 390px screen the x-axis dates do not overlap the legend (tour screenshot)."
    status: todo

  - id: LOOK-005
    title: Dashboard degrades per tile, not as a whole
    job: look
    area: dashboard
    priority: p2
    done_means:
      - "If one of the dashboard's requests fails, the other tiles still render and the failed one shows an error state (unit test with one failing endpoint)."
    status: todo

