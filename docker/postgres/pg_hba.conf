# Tallied — PostgreSQL Host-Based Authentication
#
# Security rules:
#   1. Superuser (tallied) and app role (tallied_app) can only connect
#      from localhost or Docker-internal networks (172.16.0.0/12).
#   2. Tenant credential roles (tld_*) can connect from anywhere,
#      but MUST use SSL.
#   3. All other roles are denied.
#
# pg_hba.conf is first-match: the explicit rejects below stop tallied and
# tallied_app falling through to the tld_* line from outside Docker.
# The /^tld_ user regex needs PostgreSQL 16 or later.

# TYPE  DATABASE  USER          ADDRESS          METHOD

# Local (Unix socket) — trust for superuser (used by healthcheck & migrations)
local   all       tallied                        trust

# Superuser — Docker-internal only
host    all       tallied       127.0.0.1/32     scram-sha-256
host    all       tallied       ::1/128          scram-sha-256
host    all       tallied       172.16.0.0/12    scram-sha-256
host    all       tallied       0.0.0.0/0        reject
host    all       tallied       ::/0             reject

# App role — Docker-internal only
host    all       tallied_app   127.0.0.1/32     scram-sha-256
host    all       tallied_app   ::1/128          scram-sha-256
host    all       tallied_app   172.16.0.0/12    scram-sha-256
host    all       tallied_app   0.0.0.0/0        reject
host    all       tallied_app   ::/0             reject

# Tenant credential roles (tld_*) — anywhere, SSL required
hostssl all       /^tld_        0.0.0.0/0        scram-sha-256
hostssl all       /^tld_        ::/0             scram-sha-256

# Everything else (postgres, tallied_sql_runner, unknown roles)
host    all       all           0.0.0.0/0        reject
host    all       all           ::/0             reject
