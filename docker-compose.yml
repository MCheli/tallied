# Tallied — Docker Compose
#
# Development:  docker compose up -d postgres   (then: make dev)
# Production:   docker compose --profile prod up -d

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.15-alpine3.24
    container_name: tallied-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tallied
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tallied_dev}
      POSTGRES_DB: tallied
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      # Loopback only: the superuser must never be reachable from the LAN or internet.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/postgres/init-ssl.sh:/docker-entrypoint-initdb.d/10-init-ssl.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallied"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Tallied App (production only) ──────────────────────────────────────────
  tallied:
    build: .
    image: tallied:latest
    container_name: tallied-app
    restart: unless-stopped
    profiles:
      - prod
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql://tallied:${POSTGRES_PASSWORD:-tallied_dev}@postgres:5432/tallied
    ports:
      # Loopback only; NGINX on the host (or the compose network) is the way in.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
